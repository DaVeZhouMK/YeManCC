<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>YMCC · 分区清单与输入预览定稿</title><style>
*{box-sizing:border-box}body{margin:0;background:#080e18;color:#e3ebf5;font:14px/1.5 'Segoe UI','Microsoft YaHei',sans-serif}header{padding:22px 24px 16px;display:flex;align-items:baseline;gap:18px}h1{font-size:21px;margin:0}header small{color:#8fa0b8}.schemes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 24px;max-width:1328px}.schemes button{display:flex;gap:13px;padding:14px 16px;text-align:left;color:#d7e3f2;border:1px solid #27374b;border-radius:12px;background:#111c2b;cursor:pointer}.schemes button>b{font-size:23px;line-height:1.3;color:#6a88a7}.schemes strong{display:block;font-size:16px}.schemes small{display:block;color:#8fa0b8;font-size:13px;margin-top:4px}.schemes button.active{border-color:#2ea6ff;background:#11283b}.schemes button.active>b{color:#2ea6ff}.toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:14px 24px}button,select{font:inherit}.toolbar button,.toolbar select{padding:8px 13px;color:#cdd9e8;background:#121e2d;border:1px solid #2b3d53;border-radius:7px;cursor:pointer}.toolbar .active{border-color:#2ea6ff;color:#60baff;background:#13304a}.screen-wrap{padding:0 24px}.screen{width:1280px;position:relative;overflow:hidden;border:1px solid #2b3d53;border-radius:8px;background:radial-gradient(ellipse at 25% 25%,#142d43,#090f19 70%)}.screen:before,.screen:after{content:'';position:absolute;width:360px;height:360px;border:1px solid #2583ba25;border-radius:50%;top:260px;left:100px}.screen:after{width:470px;height:470px;left:-40px;top:50px;background:#22648a09}.desktop-mark{position:absolute;left:42px;top:55px;max-width:480px;z-index:1}.desktop-mark h2{font-size:27px;margin:0 0 15px}.desktop-mark p{font-size:15px;line-height:2;color:#9eafc5}.desktop-mark .geometry{display:inline-block;border:1px solid #2b3d53;border-radius:6px;padding:6px 10px;color:#a8bdd3;font-size:13px}.desktop-mark kbd{padding:2px 6px;background:#1c3045;border-radius:5px;color:#d9e9fa}iframe{position:absolute;right:0;top:0;border:0;background:#0d131e;z-index:2}.caption{padding:14px 24px 22px;color:#8fa0b8;max-width:1310px;font-size:13px}
</style><header><h1>YMCC · 本轮定稿</h1><small>分区清单 · 手柄一体状态图 · 圆形陀螺仪</small></header><div class="schemes" hidden style="display:none"><button data-variant="a"><b>A</b><span><strong>分区清单</strong><small>横向标签，内容集中在一块编辑。</small></span></button><button data-variant="b"><b>B</b><span><strong>功能卡片</strong><small>先选任务卡片，再调节对应内容。</small></span></button><button data-variant="c"><b>C</b><span><strong>侧边分类</strong><small>分区常驻左侧，右侧专注编辑。</small></span></button></div><div class="toolbar"><button data-route="/settings">设置</button><button data-route="/power">开机启动</button><button data-route="/rtss">监控</button><button data-route="/button-mapping">虚拟手柄状态</button><button data-route="/gyro-motion">陀螺仪仪表</button><button data-height="720">1280 × 720</button><button data-height="800">1280 × 800</button><button id="detail">查看本次改动</button><button id="top">页面顶部</button><select id="theme" aria-label="颜色"><option value="blue-black">蓝黑 · 默认</option><option value="red-black">红黑</option><option value="cyberpunk">黄黑</option></select></div><div class="screen-wrap"><div class="screen" id="screen"><div class="desktop-mark"><h2 id="name"></h2><p id="description"></p><span class="geometry" id="geometry"></span><p><kbd>↑ ↓ ← →</kbd> 方向操作　<kbd>Enter / A</kbd> 选择　<kbd>Start / F8</kbd> 开始测试<br><kbd>Esc / B</kbd> 返回分区　<kbd>LB / RB</kbd> 切换页面</p><p>右侧为真实比例 H5。<br>可以切换分区、调整设置和打开下拉菜单。<br>预览设置只保留在本页面。</p></div><iframe id="product" title="YMCC 实际比例预览"></iframe></div></div><div class="caption">按实际 YMCC 窗口比例展示：720P 约535 ×720，800P 约595 ×800。直接使用本轮主线真实组件与设置逻辑；预览读数为样例，系统操作在页面内模拟。</div><script>
const q=new URLSearchParams(location.search),$=id=>document.getElementById(id);let variant=['a','b','c'].includes(q.get('variant'))?q.get('variant'):'a',route=q.get('route')||'/button-mapping',height=[720,800,1080].includes(Number(q.get('height')))?Number(q.get('height')):720,theme=q.get('theme')||'blue-black';const names={a:'一体控制台 · 本轮定稿',b:'B · 功能卡片',c:'C · 侧边分类'},descs={a:'设置分区 · 手柄方向自然可达。\n窗口呼出置顶，日志操作一行排列。\n陀螺仪和模拟镜像保持同步。',b:'用任务卡片降低设置入口的理解成本。\n手柄轮廓展示能力，陀螺仪采用三轴环形图。',c:'把分区选择与内容编辑分开。\n状态用对齐的图标清单，陀螺仪以小仪表呈现。'};
function mark(){history.replaceState(null,'','?'+new URLSearchParams({variant,height,route,theme}));$('name').textContent=names[variant];$('description').innerText=descs[variant];$('screen').style.height=height+'px';$('geometry').textContent='屏幕 1280 × '+height+' / YMCC 窗口 '+Math.round(580*height/780)+' × '+height;$('theme').value=theme;for(const b of document.querySelectorAll('[data-variant]'))b.classList.toggle('active',b.dataset.variant===variant);for(const b of document.querySelectorAll('[data-route]'))b.classList.toggle('active',b.dataset.route===route);for(const b of document.querySelectorAll('[data-height]'))b.classList.toggle('active',Number(b.dataset.height)===height)}
function focusDetail(){const doc=$('product').contentDocument;const el=doc?.querySelector(route==='/button-mapping'?'.controller-preview-row':route==='/gyro-motion'?'.gyro-status-preview':'.settings-sections');el?.scrollIntoView({block:route==='/gyro-motion'||route==='/button-mapping'?'center':'start'});}function render(){mark();$('screen').style.width=(height===1080?1920:1280)+'px';$('product').style.width=Math.round(580*height/780)+'px';$('product').style.height=height+'px';$('product').src='/product.html?'+new URLSearchParams({variant,route,height,theme,context:'global',background:'animated',simulation:q.get('simulation')||'',shortcuts:q.get('shortcuts')||''})}for(const b of document.querySelectorAll('[data-variant]'))b.onclick=()=>{variant=b.dataset.variant;render()};for(const b of document.querySelectorAll('[data-route]'))b.onclick=()=>{route=b.dataset.route;render()};for(const b of document.querySelectorAll('[data-height]'))b.onclick=()=>{height=Number(b.dataset.height);render()};$('detail').onclick=focusDetail;$('top').onclick=()=>{$('product').contentDocument?.querySelector('.app-content')?.scrollTo({top:0})};$('theme').onchange=e=>{theme=e.target.value;render()};addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==$('product').contentWindow)return;if(e.data.type==='preview-route'){route=e.data.route;mark()}if(e.data.type==='preview-theme'){theme=e.data.theme;mark()}if(e.data.type==='preview-workbench')$('product').style.width=(e.data.wide?Math.round(580*height/780)*2:Math.round(580*height/780))+'px'});render();
</script></html>
