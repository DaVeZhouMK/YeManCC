name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: yemancc-release-manifest
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag and source versions
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -ne 'tag') {
            throw 'Release workflow must run from a Git tag.'
          }
          $manifest = Get-Content -LiteralPath version.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $package = Get-Content -LiteralPath package.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $version = [string]$manifest.version
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "version.json has an invalid strict version: $version"
          }
          $versionParts = @([int64]$Matches[1], [int64]$Matches[2], [int64]$Matches[3])
          if (@($versionParts | Where-Object { $_ -gt [int]::MaxValue }).Count -gt 0) {
            throw "version.json version part is out of range: $version"
          }
          if ([string]$package.version -ne $version) {
            throw "Version mismatch: version.json=$version, package.json=$($package.version)"
          }
          $expectedTag = "v$version"
          if ('${{ github.ref_name }}' -ne $expectedTag) {
            throw "Tag mismatch: expected $expectedTag, got ${{ github.ref_name }}"
          }

      - name: Setup pnpm 11.16.0
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup MSVC and Windows SDK
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and assemble Release
        shell: pwsh
        run: |
          $env:YEMAN_WORKSPACE_ROOT = $env:GITHUB_WORKSPACE
          $releaseEnvelope = if ('${{ github.ref_name }}' -in @('v0.0.22', 'v0.0.23', 'v0.0.24', 'v0.0.25')) { 'legacy-bootstrap' } elseif ('${{ github.ref_name }}' -in @('v0.0.20', 'v0.0.21')) { 'legacy-bridge' } else { 'full' }
          $env:YEMAN_RELEASE_ENVELOPE = $releaseEnvelope
          pnpm run build
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/package-release.ps1 -WorkspaceRoot $env:GITHUB_WORKSPACE -ReleaseEnvelope $releaseEnvelope

      - name: Verify release outputs
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $required = @(
            'Release\YeManCC\YeManCC.exe',
            'Release\YeManCC\index.html',
            'Release\PowerControl\pawnio\YeManTdpCtl.exe',
            'Release\PowerControl\pawnio\_internal\python313.dll',
            'Release\YeManCC\update-manifest.json',
            'Release\Packages\YeManCC.zip',
            'Release\version.json'
          )
          foreach ($relative in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $root $relative))) {
              throw "Release output missing: $relative"
            }
          }
          $releaseManifest = (Get-Content -LiteralPath (Join-Path $root 'Release\version.json') -Raw -Encoding UTF8).TrimStart([char]0xFEFF) | ConvertFrom-Json
          $layoutManifestText = Get-Content -LiteralPath (Join-Path $root 'Release\YeManCC\update-manifest.json') -Raw -Encoding UTF8
          $layoutManifest = $layoutManifestText.TrimStart([char]0xFEFF) | ConvertFrom-Json
          if ([int]$layoutManifest.schemaVersion -ne 1 -or [string]$layoutManifest.packageVersion -ne [string]$releaseManifest.version) {
            throw 'Release update-manifest.json has an invalid schema or package version.'
          }
          $declaredRoots = @($layoutManifest.roots | ForEach-Object { [string]$_.source } | Sort-Object -Unique)
          $requiredRoots = @($layoutManifest.requiredRoots | ForEach-Object { [string]$_ } | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Sort-Object -Unique)
          $missingRoots = @($requiredRoots | Where-Object { $_ -notin $declaredRoots })
          if ($missingRoots.Count -gt 0) { throw "update-manifest.json misses required roots: $($missingRoots -join ', ')" }
          foreach ($definition in @($layoutManifest.roots)) {
            $rootPath = Join-Path $root (Join-Path 'Release' ([string]$definition.source))
            if (-not (Test-Path -LiteralPath $rootPath -PathType Container)) { throw "Release root missing: $($definition.source)" }
            if ($definition.packageManifest -and -not (Test-Path -LiteralPath (Join-Path $rootPath ([string]$definition.packageManifest)) -PathType Leaf)) {
              throw "Release package manifest missing: $($definition.source)/$($definition.packageManifest)"
            }
          }
          $localHash = (Get-FileHash -LiteralPath (Join-Path $root 'Release\Packages\YeManCC.zip') -Algorithm SHA256).Hash
          if ($localHash -ne [string]$releaseManifest.sha256) {
            throw "Release manifest SHA-256 mismatch: expected $($releaseManifest.sha256), got $localHash"
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Join-Path $root 'Release\Packages\YeManCC.zip'))
          try {
            $roots = @($zip.Entries | ForEach-Object {
              $normalized = $_.FullName.Replace('\', '/').TrimStart('/')
              if ($normalized) { ($normalized -split '/')[0] }
            } | Sort-Object -Unique)
            $missingZipRoots = @($requiredRoots | Where-Object { $_ -notin $roots })
            $unexpectedZipRoots = @($roots | Where-Object { $_ -notin $declaredRoots })
            if ($missingZipRoots.Count -gt 0 -or $unexpectedZipRoots.Count -gt 0) {
              throw "YeManCC.zip roots do not match update-manifest.json; missing: $($missingZipRoots -join ', '); unexpected: $($unexpectedZipRoots -join ', '); got: $($roots -join ', ')"
            }
            $layoutManifestEntries = @($zip.Entries | Where-Object { $_.FullName.Replace('\', '/') -eq 'YeManCC/update-manifest.json' })
            if ('${{ github.ref_name }}' -in @('v0.0.22', 'v0.0.23', 'v0.0.24', 'v0.0.25')) {
              if ($layoutManifestEntries.Count -ne 0) { throw '${{ github.ref_name }} bootstrap ZIP must not contain YeManCC/update-manifest.json' }
            } elseif ($layoutManifestEntries.Count -ne 1) {
              throw 'YeManCC.zip must contain exactly one YeManCC/update-manifest.json'
            }
            $flat = @($zip.Entries | Where-Object {
              $normalized = $_.FullName.Replace('\', '/').TrimStart('/')
              $normalized -and ($normalized -split '/').Count -eq 1 -and -not $normalized.EndsWith('/')
            })
            if ($flat.Count -gt 0) { throw 'YeManCC.zip contains flattened YeManCC entries.' }
          } finally {
            $zip.Dispose()
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Release/Packages/YeManCC.zip
          overwrite_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published package before advertising the version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $release = gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json assets | ConvertFrom-Json
          $asset = @($release.assets | Where-Object { $_.name -eq 'YeManCC.zip' })
          if ($asset.Count -ne 1) {
            throw 'GitHub Release does not contain exactly one YeManCC.zip asset.'
          }
          $manifest = (Get-Content -LiteralPath Release\version.json -Raw -Encoding UTF8).TrimStart([char]0xFEFF) | ConvertFrom-Json
          $downloadRoot = Join-Path $env:RUNNER_TEMP 'published-yemancc'
          New-Item -ItemType Directory -Path $downloadRoot -Force | Out-Null
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern 'YeManCC.zip' --dir $downloadRoot --clobber
          $publishedHash = (Get-FileHash -LiteralPath (Join-Path $downloadRoot 'YeManCC.zip') -Algorithm SHA256).Hash
          if ($publishedHash -ne [string]$manifest.sha256) {
            throw "Published asset SHA-256 mismatch: expected $($manifest.sha256), got $publishedHash"
          }

      - name: Preserve generated version manifest
        shell: pwsh
        run: Copy-Item -LiteralPath Release\version.json -Destination $env:RUNNER_TEMP\version.json -Force

      - name: Check main manifest publish order
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $generated = (Get-Content -LiteralPath Release\version.json -Raw -Encoding UTF8).TrimStart([char]0xFEFF) | ConvertFrom-Json
          $currentText = gh api "repos/${{ github.repository }}/contents/version.json?ref=main" --jq .content
          $currentText = ($currentText -replace '\s', '')
          $currentJsonText = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($currentText))
          # GitHub contents may return a UTF-8 BOM from an older manifest.
          # Strip it before ConvertFrom-Json so publish-order validation is
          # independent of how the previous manifest was written.
          $currentJsonText = $currentJsonText.TrimStart([char]0xFEFF)
          $currentJson = $currentJsonText | ConvertFrom-Json
          $parse = {
            param([string]$value)
            if ($value -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw "Invalid manifest version: $value" }
            $parts = @([int64]$Matches[1], [int64]$Matches[2], [int64]$Matches[3])
            if (@($parts | Where-Object { $_ -gt [int]::MaxValue }).Count -gt 0) { throw "Manifest version part is out of range: $value" }
            return $parts
          }
          $incoming = & $parse ([string]$generated.version)
          $current = & $parse ([string]$currentJson.version)
          $compare = 0
          for ($i = 0; $i -lt 3; $i++) {
            if ($incoming[$i] -lt $current[$i]) { $compare = -1; break }
            if ($incoming[$i] -gt $current[$i]) { $compare = 1; break }
          }
          if ($compare -lt 0) {
            throw "Refusing to replace main/version.json $($currentJson.version) with older $($generated.version)"
          }

      - name: Commit version manifest back to main via API
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = '${{ github.repository }}'
          $manifestPath = Join-Path $env:RUNNER_TEMP 'version.json'
          $generated = (Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8).TrimStart([char]0xFEFF) | ConvertFrom-Json
          $current = gh api "repos/$repo/contents/version.json?ref=main" | ConvertFrom-Json
          $currentText = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($current.content -replace '\s', ''))).TrimStart([char]0xFEFF)
          $currentJson = $currentText | ConvertFrom-Json
          if ([version]$generated.version -lt [version]$currentJson.version) {
            throw "Refusing to replace main/version.json $($currentJson.version) with older $($generated.version)"
          }
          $content = [Convert]::ToBase64String([IO.File]::ReadAllBytes($manifestPath))
          $payload = [ordered]@{
            message = "chore: update version manifest (${{ github.ref_name }})"
            content = $content
            sha = [string]$current.sha
            branch = 'main'
          } | ConvertTo-Json -Compress
          $result = $payload | gh api --method PUT "repos/$repo/contents/version.json" --input - | ConvertFrom-Json
          if (-not $result.commit.sha) { throw 'Failed to commit generated version manifest through GitHub API' }
          Write-Output "version manifest committed: $($result.commit.sha)"
