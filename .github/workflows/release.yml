name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: yemancc-release-manifest
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Keep build outputs and acceptance evidence outside tracked product sources.
      YEMAN_WORKSPACE_ROOT: ${{ github.workspace }}/../..
      pnpm_config_verify_deps_before_run: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and check immutable release candidate
        id: candidate
        uses: ./.github/actions/release-build
        with:
          mode: formal

      - name: Save release identity and official Decky evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: decky-update-release-evidence
          path: |
            ${{ env.YEMAN_WORKSPACE_ROOT }}/Build/Validation/DeckyUpdate/OfficialLoader
            ${{ env.YEMAN_WORKSPACE_ROOT }}/Build/Validation/ExportIdentity
            ${{ env.YEMAN_WORKSPACE_ROOT }}/Build/Validation/opt-gate
            ${{ env.YEMAN_WORKSPACE_ROOT }}/Build/Validation/DeckyExport
            ${{ env.YEMAN_WORKSPACE_ROOT }}/Release/version.json
          if-no-files-found: warn

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3; Node.js 24
        with:
          files: |
            ${{ env.YEMAN_WORKSPACE_ROOT }}/Release/Packages/YeManCC.zip
            ${{ env.YEMAN_WORKSPACE_ROOT }}/Release/Packages/YeManCC-source-${{ github.ref_name }}.zip
            ${{ env.YEMAN_WORKSPACE_ROOT }}/Release/Packages/version.json
            ${{ env.YEMAN_WORKSPACE_ROOT }}/Release/Packages/SHA256SUMS.txt
          fail_on_unmatched_files: true
          tag_name: ${{ steps.candidate.outputs.tag }}
          overwrite_files: false
          body_path: ${{ steps.candidate.outputs.notes-path }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published package before advertising the version
        timeout-minutes: 10
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $release = gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json 'assets,isDraft,isPrerelease' | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $release) { throw 'Cannot read the published release.' }
          if ($release.isDraft -or $release.isPrerelease) { throw 'Formal release must be public and stable before advertising.' }
          $names = @('YeManCC.zip', "YeManCC-source-${{ github.ref_name }}.zip", 'version.json', 'SHA256SUMS.txt')
          foreach ($name in $names) {
            $matches = @($release.assets | Where-Object { $_.name -ceq $name })
            if ($matches.Count -ne 1 -or $matches[0].state -cne 'uploaded' -or $matches[0].size -le 0) {
              throw "Published attachment missing, duplicated or incomplete: $name"
            }
          }
          $asset = @($release.assets | Where-Object { $_.name -eq 'YeManCC.zip' })
          if ($asset.Count -ne 1) {
            throw 'GitHub Release does not contain exactly one YeManCC.zip asset.'
          }
          $retiredAsset = @($release.assets | Where-Object { $_.name -eq 'YeManCC-Complete.zip' })
          if ($retiredAsset.Count -ne 0) {
            throw 'GitHub Release must not contain the incorrect asset name YeManCC-Complete.zip.'
          }
          $manifest = (Get-Content -LiteralPath (Join-Path $env:YEMAN_WORKSPACE_ROOT 'Release/version.json') -Raw -Encoding UTF8).TrimStart([char]0xFEFF) | ConvertFrom-Json
          $downloadRoot = Join-Path $env:RUNNER_TEMP 'published-yemancc'
          New-Item -ItemType Directory -Path $downloadRoot -Force | Out-Null
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern 'YeManCC.zip' --dir $downloadRoot --clobber
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw 'Cannot download published complete package after 3 attempts.' }
            Start-Sleep -Seconds $attempt
          }
          $publishedHash = (Get-FileHash -LiteralPath (Join-Path $downloadRoot 'YeManCC.zip') -Algorithm SHA256).Hash
          if ($publishedHash -ne [string]$manifest.sha256) {
            throw "Published asset SHA-256 mismatch: expected $($manifest.sha256), got $publishedHash"
          }

      - name: Verify every complete-release attachment by downloading published bytes
        timeout-minutes: 10
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $names = @('YeManCC.zip', "YeManCC-source-$tag.zip", 'version.json', 'SHA256SUMS.txt')
          $downloadRoot = Join-Path $env:RUNNER_TEMP 'published-yemancc'
          foreach ($name in $names) {
            $local = Join-Path $env:YEMAN_WORKSPACE_ROOT "Release/Packages/$name"
            $public = Join-Path $downloadRoot $name
            if (-not (Test-Path -LiteralPath $public -PathType Leaf)) {
              for ($attempt = 1; $attempt -le 3; $attempt++) {
                gh release download $tag --repo '${{ github.repository }}' --pattern $name --dir $downloadRoot --clobber
                if ($LASTEXITCODE -eq 0) { break }
                if ($attempt -eq 3) { throw "Cannot download published attachment after 3 attempts: $name" }
                Start-Sleep -Seconds $attempt
              }
            }
            if ((Get-FileHash -LiteralPath $local -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath $public -Algorithm SHA256).Hash) {
              throw "Published attachment differs from its built/source bytes: $name"
            }
            Write-Output "PUBLIC_ATTACHMENT_HASH_OK $name"
          }

      - name: Verify published Fan Host V2 lane and source-bound bytes
        shell: pwsh
        run: |
          $downloadRoot = Join-Path $env:RUNNER_TEMP 'published-yemancc'
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/fan_host_path_gate.ps1 -ProjectRoot $env:GITHUB_WORKSPACE -ReleaseZip (Join-Path $downloadRoot 'YeManCC.zip')
          if ($LASTEXITCODE -ne 0) { throw 'Published Fan Host V2 path/identity gate failed.' }

      - name: Preserve generated version manifest
        shell: pwsh
        run: Copy-Item -LiteralPath (Join-Path $env:YEMAN_WORKSPACE_ROOT 'Release/version.json') -Destination $env:RUNNER_TEMP\version.json -Force

      - name: Check main manifest publish order
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $generated = (Get-Content -LiteralPath (Join-Path $env:YEMAN_WORKSPACE_ROOT 'Release/version.json') -Raw -Encoding UTF8).TrimStart([char]0xFEFF) | ConvertFrom-Json
          $currentText = gh api "repos/${{ github.repository }}/contents/version.json?ref=main" --jq .content
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read main manifest before advertising.' }
          $currentText = ($currentText -replace '\s', '')
          $currentJsonText = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($currentText))
          # GitHub contents may return a UTF-8 BOM from an older manifest.
          # Strip it before ConvertFrom-Json so publish-order validation is
          # independent of how the previous manifest was written.
          $currentJsonText = $currentJsonText.TrimStart([char]0xFEFF)
          $currentJson = $currentJsonText | ConvertFrom-Json
          $parse = {
            param([string]$value)
            if ($value -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw "Invalid manifest version: $value" }
            $parts = @([int64]$Matches[1], [int64]$Matches[2], [int64]$Matches[3])
            if (@($parts | Where-Object { $_ -gt [int]::MaxValue }).Count -gt 0) { throw "Manifest version part is out of range: $value" }
            return $parts
          }
          $incoming = & $parse ([string]$generated.version)
          $current = & $parse ([string]$currentJson.version)
          $compare = 0
          for ($i = 0; $i -lt 3; $i++) {
            if ($incoming[$i] -lt $current[$i]) { $compare = -1; break }
            if ($incoming[$i] -gt $current[$i]) { $compare = 1; break }
          }
          if ($compare -lt 0) {
            throw "Refusing to replace main/version.json $($currentJson.version) with older $($generated.version)"
          }

      - name: Commit version manifest back to main via API
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = '${{ github.repository }}'
          $manifestPath = Join-Path $env:RUNNER_TEMP 'version.json'
          $generated = (Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8).TrimStart([char]0xFEFF) | ConvertFrom-Json
          $current = gh api "repos/$repo/contents/version.json?ref=main" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $current.sha) { throw 'Cannot read current main manifest identity.' }
          $currentText = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($current.content -replace '\s', ''))).TrimStart([char]0xFEFF)
          $currentJson = $currentText | ConvertFrom-Json
          if ([version]$generated.version -lt [version]$currentJson.version) {
            throw "Refusing to replace main/version.json $($currentJson.version) with older $($generated.version)"
          }
          $content = [Convert]::ToBase64String([IO.File]::ReadAllBytes($manifestPath))
          $payload = [ordered]@{
            message = "chore: update version manifest (${{ github.ref_name }})"
            content = $content
            sha = [string]$current.sha
            branch = 'main'
          } | ConvertTo-Json -Compress
          $result = $payload | gh api --method PUT "repos/$repo/contents/version.json" --input - | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $result.commit.sha) { throw 'Failed to commit generated version manifest through GitHub API' }
          Write-Output "version manifest committed: $($result.commit.sha)"

      - name: Preserve release provenance and checksums
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-provenance-${{ github.ref_name }}
          path: |
            ${{ runner.temp }}/release-runner-compatibility.json
            ${{ runner.temp }}/release-preflight-*.json
            ${{ runner.temp }}/version.json
            ${{ env.YEMAN_WORKSPACE_ROOT }}/Release/Packages/SHA256SUMS.txt
          if-no-files-found: warn
