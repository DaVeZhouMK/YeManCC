name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm 11.16.0
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup MSVC and Windows SDK
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and assemble Release
        shell: pwsh
        run: |
          $env:YEMAN_WORKSPACE_ROOT = $env:GITHUB_WORKSPACE
          pnpm run release

      - name: Verify release outputs
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $required = @(
            'Release\YeManCC\YeManCC.exe',
            'Release\YeManCC\index.html',
            'Release\PowerControl\pawnio\YeManTdpCtl.exe',
            'Release\PowerControl\pawnio\LpcIO.bin',
            'Release\PowerControl\pawnio\_internal\python313.dll',
            'Release\Packages\YeManCC.zip',
            'Release\version.json',
            'Release\release-manifest.json',
            'Release\release-manifest.sha256'
          )
          foreach ($relative in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $root $relative))) {
              throw "Release output missing: $relative"
            }
          }

      - name: Preserve generated version manifest
        shell: pwsh
        run: Copy-Item -LiteralPath Release\version.json -Destination $env:RUNNER_TEMP\version.json -Force

      - name: Commit version manifest back to main
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          cp "$RUNNER_TEMP/version.json" version.json
          git add version.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update version manifest (${{ github.ref_name }})" || echo "no change"
          git push origin main

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Release/Packages/YeManCC.zip
            Release/Packages/YeManCC-*.zip
            Release/release-manifest.json
            Release/release-manifest.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
