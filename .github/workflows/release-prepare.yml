name: Prepare GitHub release (no publish)

on:
  push:
    branches:
      - 'release-preparation/**'
  workflow_dispatch:
    inputs:
      build_packages:
        description: Also compile and package the complete candidate (no publish; no fixtures)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: yemancc-release-preparation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: windows-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.build_packages && 60 || 10 }}
    env:
      pnpm_config_verify_deps_before_run: 'false'
      YEMAN_WORKSPACE_ROOT: ${{ github.workspace }}/../..
    steps:
      - name: Checkout immutable preparation commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Build and check immutable release candidate
        id: candidate
        uses: ./.github/actions/release-build
        with:
          mode: prepare
          check-only: ${{ github.event_name != 'workflow_dispatch' || !inputs.build_packages }}

      - name: Save prepared attachments
        if: ${{ steps.candidate.outputs.packages-built == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-preparation-${{ steps.candidate.outputs.tag }}-${{ github.run_id }}
          path: ${{ env.YEMAN_WORKSPACE_ROOT }}/Release/Packages/*
          if-no-files-found: error
          retention-days: 14

      - name: Save preparation diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-preparation-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/release-runner-compatibility.json
            ${{ runner.temp }}/release-preflight-*.json
            ${{ env.YEMAN_WORKSPACE_ROOT }}/Build/Validation/ExportIdentity
            ${{ env.YEMAN_WORKSPACE_ROOT }}/Build/Validation/DeckyUpdate/OfficialLoader
            ${{ env.YEMAN_WORKSPACE_ROOT }}/Release/version.json
          if-no-files-found: warn
          retention-days: 14
